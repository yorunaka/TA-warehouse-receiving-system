openapi: 3.0.3
info:
title: Warehouse Receiving System API
description: >
RESTful API specification for managing product master data, inbound receiving documents,
inventory stock levels, and transaction history logs. Built for the Warehouse Receiving System assessment.
version: 1.0.0
servers:

* url: http://localhost:3000/api
  description: Local Docker / Development Server

paths:
/health:
get:
summary: Health check & readiness endpoint
description: Returns service status and verifies PostgreSQL database connectivity.
responses:
'200':
description: System is healthy and database is connected.
content:
application/json:
schema:
type: object
properties:
status:
type: string
example: healthy
timestamp:
type: string
format: date-time
database:
type: string
example: connected
'500':
description: System unhealthy or database disconnected.

/products:
get:
summary: List all products
description: Retrieves product master catalog with current inventory tracking. Accessible by Operator and Admin roles.
responses:
'200':
description: List of products returned successfully.
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
example: true
data:
type: array
items:
\$ref: '#/components/schemas/Product'
post:
summary: Create a new product (Admin Only)
description: Creates a product with a unique SKU. Automatically initializes associated inventory stock record to 0.
parameters:
\- \$ref: '#/components/parameters/UserIdHeader'
requestBody:
required: true
content:
application/json:
schema:
type: object
required:
\- sku
\- name
properties:
sku:
type: string
example: "SKU-KEYBOARD-01"
name:
type: string
example: "Mechanical Keyboard"
description:
type: string
example: "RGB Wireless Mechanical Keyboard"
responses:
'201':
description: Product created successfully.
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
example: true
data:
\$ref: '#/components/schemas/Product'
'400':
description: Invalid input or missing required fields.
'403':
description: Forbidden - Admin permission required.
'409':
description: Conflict - Product SKU already exists.

/receiving-documents:
get:
summary: List receiving documents
description: Retrieves all inbound receiving document headers with item counts.
responses:
'200':
description: List of receiving documents.
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
example: true
data:
type: array
items:
\$ref: '#/components/schemas/ReceivingDocumentSummary'
post:
summary: Create a receiving document (Admin Only)
description: Initializes a new receiving document in DRAFT status with expected product line items.
parameters:
\- \$ref: '#/components/parameters/UserIdHeader'
requestBody:
required: true
content:
application/json:
schema:
type: object
required:
\- document_number
\- items
properties:
document_number:
type: string
example: "REC-2026-001"
items:
type: array
items:
type: object
required:
\- product_id
\- expected_quantity
properties:
product_id:
type: integer
example: 1
expected_quantity:
type: integer
minimum: 1
example: 10
responses:
'201':
description: Receiving document created in DRAFT status.
'400':
description: Invalid input parameters.
'403':
description: Forbidden - Admin permission required.
'409':
description: Document number already exists.

/receiving-documents/{id}:
get:
summary: Get receiving document detail
description: Returns detailed receiving document header along with its line items and current progress.
parameters:
\- name: id
in: path
required: true
schema:
type: integer
example: 1
responses:
'200':
description: Document detail retrieved.
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
example: true
data:
\$ref: '#/components/schemas/ReceivingDocumentDetail'
'404':
description: Receiving document not found.

/receiving-documents/{id}/receive:
post:
summary: Process item receiving transaction (Core Engine)
description: >
Records partial or full receipt of a line item. Validates over-receiving constraints,
atomically increments inventory stock, logs an audit transaction, and updates document status
(IN_PROGRESS or COMPLETED).
parameters:
\- name: id
in: path
required: true
schema:
type: integer
example: 1
\- \$ref: '#/components/parameters/UserIdHeader'
requestBody:
required: true
content:
application/json:
schema:
type: object
required:
\- item_id
\- quantity_received
properties:
item_id:
type: integer
example: 1
quantity_received:
type: integer
minimum: 1
example: 4
responses:
'200':
description: Receipt processed successfully. Stock updated and audit log appended.
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
example: true
data:
type: object
properties:
receiving_document_status:
type: string
enum: \[IN_PROGRESS, COMPLETED\]
example: IN_PROGRESS
received_item:
\$ref: '#/components/schemas/ReceivingItem'
'400':
description: Over-receipt violation OR receiving attempted on locked document (COMPLETED/CANCELLED).
'404':
description: Document or line item not found.

/inventory:
get:
summary: View current available inventory
description: Returns real-time available stock levels per product.
responses:
'200':
description: Available inventory list.
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
example: true
data:
type: array
items:
\$ref: '#/components/schemas/InventoryStock'

/inventory/transactions:
get:
summary: View inventory audit transaction history
description: Returns an immutable log of all inventory movements triggered by receiving operations.
responses:
'200':
description: Inventory transactions audit trail.
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
example: true
data:
type: array
items:
\$ref: '#/components/schemas/InventoryTransaction'

components:
parameters:
UserIdHeader:
name: x-user-id
in: header
description: User identity ID for authorization simulation (1 = Admin Supervisor, 2 = Warehouse Operator).
required: false
schema:
type: string
default: "2"

schemas:
Product:
type: object
properties:
id:
type: integer
example: 1
sku:
type: string
example: "SKU-KEYBOARD-01"
name:
type: string
example: "Mechanical Keyboard"
description:
type: string
nullable: true
example: "RGB Wireless Keyboard"
created_at:
type: string
format: date-time

```
ReceivingDocumentSummary:
  type: object
  properties:
    id:
      type: integer
      example: 1
    document_number:
      type: string
      example: "REC-2026-001"
    status:
      type: string
      enum: [DRAFT, IN_PROGRESS, COMPLETED, CANCELLED]
      example: DRAFT
    created_by_user:
      type: string
      example: "admin_supervisor"
    total_items:
      type: integer
      example: 2
    created_at:
      type: string
      format: date-time

ReceivingItem:
  type: object
  properties:
    id:
      type: integer
      example: 1
    receiving_document_id:
      type: integer
      example: 1
    product_id:
      type: integer
      example: 1
    sku:
      type: string
      example: "SKU-KEYBOARD-01"
    product_name:
      type: string
      example: "Mechanical Keyboard"
    expected_quantity:
      type: integer
      example: 10
    received_quantity:
      type: integer
      example: 4

ReceivingDocumentDetail:
  type: object
  properties:
    id:
      type: integer
      example: 1
    document_number:
      type: string
      example: "REC-2026-001"
    status:
      type: string
      enum: [DRAFT, IN_PROGRESS, COMPLETED, CANCELLED]
      example: IN_PROGRESS
    created_by_username:
      type: string
      example: "admin_supervisor"
    created_at:
      type: string
      format: date-time
    items:
      type: array
      items:
        $ref: '#/components/schemas/ReceivingItem'

InventoryStock:
  type: object
  properties:
    id:
      type: integer
      example: 1
    product_id:
      type: integer
      example: 1
    sku:
      type: string
      example: "SKU-KEYBOARD-01"
    product_name:
      type: string
      example: "Mechanical Keyboard"
    available_quantity:
      type: integer
      example: 4
    updated_at:
      type: string
      format: date-time

InventoryTransaction:
  type: object
  properties:
    id:
      type: integer
      example: 1
    product_id:
      type: integer
      example: 1
    sku:
      type: string
      example: "SKU-KEYBOARD-01"
    product_name:
      type: string
      example: "Mechanical Keyboard"
    receiving_document_id:
      type: integer
      example: 1
    document_number:
      type: string
      example: "REC-2026-001"
    quantity_changed:
      type: integer
      example: 4
    transaction_type:
      type: string
      example: RECEIPT
    performed_by:
      type: string
      example: "warehouse_operator"
    created_at:
      type: string
      format: date-time

```